#
# Auto-Clean: the daily housekeeping run, and the thing that starts the builds.
#
# Upstream's model, kept on purpose: one nightly run removes the previous
# images, tags, artifacts and run history, and every build pipeline is
# triggered by its completion (`workflow_run`). That keeps exactly one day of
# output and gives the whole matrix a single start time, instead of six
# independent crons that can overlap on a shared runner quota.
#
# Start time: 20:00 UTC = 04:00 Asia/Shanghai. Images are ready by ~06:00.
#
# This repository holds no build inputs any more: the patched honk core and the
# einat binaries are published by kwrum1/dpd-fw, so everything here is
# disposable firmware output.

name: Auto-Clean

on:
  schedule:
    - cron: 0 20 * * *
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: maintenance-auto-clean
  cancel-in-progress: false

jobs:
  auto_clean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Delete old Releases, Tags and Workflow runs
        uses: ophub/delete-releases-workflows@main
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          delete_releases: true
          releases_keep_latest: 0
          delete_tags: true
          delete_workflows: true
          # Keep one day of runs: with 0 the job also wipes runs that are still
          # queued/in progress, which makes a CI failure impossible to inspect.
          workflows_keep_day: 1

      # The action above does not touch artifacts. They are the largest thing
      # an image build leaves behind (build reports, provenance, per-target
      # uploads), so a nightly full wipe keeps the repository clean.
      - name: Delete all workflow artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id, .name] | @tsv' > /tmp/artifacts.tsv || true

          total=$(wc -l < /tmp/artifacts.tsv)
          echo "artifacts to delete: $total"
          while IFS=$'\t' read -r id name; do
            [ -n "${id:-}" ] || continue
            echo "  delete $id  $name"
            gh api -X DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id" >/dev/null || \
              echo "  warning: could not delete $id"
          done < /tmp/artifacts.tsv

# Copyright (C) 2026 kwrum1
#
# EINAT-BUILD: build the einat-ebpf binaries we ship, from upstream source,
# with our perf patches applied, publish them as a release, and run functional
# checks against the same source.
#
# Preset: `static` = without the `ipv6` cargo feature, i.e. no NAT66 code in
# the BPF program. This firmware never NATs v6 (v6 is routed/accelerated by
# dpd + direct rules), so the v4-only build is the correct one and is smaller.
#
# Patches, applied in order, all anchored (upstream drift fails the job):
#   patches/einat-perf.py     p1: one less L2/L3 parse per packet per direction
#   patches/einat-perf-p2.py  p2: dest_config fast path + established-TCP CT
#                                 fast path (see the file header for the why)
#
# The `test` job builds the same source for Linux in debug mode and runs
# patches/einat-e2e-nat.sh inside network namespaces: EIM/EIF (full cone),
# ICMP, a 20 MB TCP transfer (which lives on the CT fast path), and both new
# fast paths.

name: EINAT-BUILD

on:
  workflow_dispatch:
  push:
    paths:
      - 'patches/einat-perf.py'
      - 'patches/einat-perf-p2.py'
      - 'patches/einat-e2e-nat.sh'
      - '.github/workflows/EINAT-BUILD.yml'

permissions: write-all

concurrency:
  group: einat-build
  cancel-in-progress: false

env:
  EINAT_REPO: https://github.com/EHfive/einat-ebpf.git
  # Pinned: the patches anchor on this revision and the release assets must be
  # reproducible. Bump only together with the patches.
  EINAT_COMMIT: ba647ce61bd6bdf2cb693961a82b88c442ef049a
  # p2 asset names stay distinct from upstream's and from p1, so a cached
  # download can never be mistaken for a different binary.
  ASSET_PREFIX: einat-p2
  RELEASE_TAG: einat-p2

jobs:
  # Functional check first: no point publishing a binary that cannot pass it.
  test:
    name: e2e (netns)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout this repo
        uses: actions/checkout@main

      - name: Clone einat (pinned)
        run: |
          git clone $EINAT_REPO einat
          git -C einat checkout $EINAT_COMMIT
          git -C einat log -1 --pretty='%H %cI %s'

      - name: Apply patches
        run: |
          python3 patches/einat-perf.py einat
          python3 patches/einat-perf-p2.py einat

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm libbpf-dev pkg-config libelf-dev curl iproute2 python3

      - name: Build (debug, aya loader)
        run: cd einat && cargo build

      - name: Datapath functional checks
        run: |
          sudo -E EINAT="$GITHUB_WORKSPACE/einat/target/debug/einat" \
              bash patches/einat-e2e-nat.sh

  build:
    name: ${{ matrix.arch }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@main

      - name: Clone einat (pinned)
        run: |
          git clone $EINAT_REPO einat
          git -C einat checkout $EINAT_COMMIT
          git -C einat log -1 --pretty='%H %cI %s'

      - name: Apply patches
        run: |
          python3 patches/einat-perf.py einat
          python3 patches/einat-perf-p2.py einat

      - name: Show the patched hot path
        run: |
          grep -n "lookup_dest_config_fast\|ct_fast_path(" -A3 einat/src/bpf/einat.bpf.c | head -40

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            sandbox = false

      - name: Build (upstream preset static, no NAT66)
        run: |
          cd einat
          nix build .#static-${{ matrix.arch }}-unknown-linux-musl
          cp ./result/bin/einat ../${{ env.ASSET_PREFIX }}-${{ matrix.arch }}-unknown-linux-musl
          file ../${{ env.ASSET_PREFIX }}-${{ matrix.arch }}-unknown-linux-musl
          ls -l ../${{ env.ASSET_PREFIX }}-${{ matrix.arch }}-unknown-linux-musl

      - name: Smoke test the binary
        if: matrix.arch == 'x86_64'
        run: |
          chmod +x ${{ env.ASSET_PREFIX }}-x86_64-unknown-linux-musl
          ./${{ env.ASSET_PREFIX }}-x86_64-unknown-linux-musl --help | head -5

      - name: Upload
        uses: actions/upload-artifact@main
        with:
          name: einat-${{ matrix.arch }}
          path: ${{ env.ASSET_PREFIX }}-${{ matrix.arch }}-unknown-linux-musl

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@main
        with:
          path: out
          merge-multiple: true

      - name: Hashes
        run: |
          cd out
          sha256sum * | tee SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@master
        with:
          # Fixed tag: the package pins this URL; the body records the run.
          tag_name: ${{ env.RELEASE_TAG }}
          files: out/*
          body: |
            einat-ebpf built from upstream `${{ env.EINAT_COMMIT }}` with
            `patches/einat-perf.py` (p1) and `patches/einat-perf-p2.py` (p2)
            applied: v4-only preset, one less L2/L3 parse per packet, a
            dest_config fast path, and an established-TCP CT fast path.

            Verified by the `e2e (netns)` job of this workflow run
            (EIM/EIF, ICMP, TCP bulk, both fast paths).

            Source: https://github.com/EHfive/einat-ebpf
            Patches: patches/einat-perf*.py in this repository

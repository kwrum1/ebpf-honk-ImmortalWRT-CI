#
# MTK-ALL: MediaTek (Filogic) images.
#
# Runs on a schedule of its own instead of chaining off upstream's nightly
# Auto-Clean: this repository no longer depends on upstream's workflow order.
# Source is upstream VIKINGYFY/immortalwrt@owrt; the release provenance file
# records the exact commit each image was built from.

name: MTK-ALL

on:
  schedule:
    - cron: 30 19 * * *
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: 'Extra package lines for .config'
        required: false
        type: string
      TEST:
        description: 'Config-only run (no image)'
        default: 'false'
        required: false
        type: boolean

permissions: write-all

jobs:
  config:
    name: ${{ matrix.CONFIG }}
    strategy:
      fail-fast: false
      matrix:
        CONFIG: [MEDIATEK-WIFI-YES, MEDIATEK-WIFI-NO]
        SOURCE: [VIKINGYFY/immortalwrt]
        BRANCH: [owrt]

    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: ${{ matrix.CONFIG }}
      WRT_THEME: aurora
      WRT_NAME: OWRT
      WRT_SSID: OWRT
      WRT_WORD: 12345678
      WRT_IP: 192.168.10.1
      WRT_PW: 无
      WRT_REPO: https://github.com/${{ matrix.SOURCE }}.git
      WRT_BRANCH: ${{ matrix.BRANCH }}
      WRT_SOURCE: ${{ matrix.SOURCE }}
      WRT_PACKAGE: ${{ inputs.PACKAGE }}
      WRT_TEST: ${{ inputs.TEST }}

#
# HONK-CORE: build the p1 honk core for x86/RK from the pinned upstream
# daeuniverse/honk commit and publish it under the fixed `core-p1` tag.
#
# Why a separate workflow: the honk package for X86/ROCKCHIP downloads a
# prebuilt core (no Rust build in the 90-minute image pipeline). The p1 patch
# hands direct-classified flows back to the classic TC chain so dpd keeps
# seeing direct traffic; the stock upstream core returns TC_ACT_OK and makes
# the classic chain unreachable.
#
# IPQ/MTK do not use this: they build the stock upstream honk package and its
# stock core assets (hardware flowtable/PPE path).
#
# One job, all architectures: ci/build-core.sh writes a single
# honk/generated-stage.mk with the per-arch asset names and hashes. Splitting
# into a matrix would have each job overwrite that manifest with only its own
# arch.

name: HONK-CORE

on:
  workflow_dispatch:
  push:
    paths:
      - 'patches/honk/ci/**'
      - '.github/workflows/HONK-CORE.yml'

permissions:
  contents: write

env:
  HONK_SOURCE_TAG: core-p1

jobs:
  core:
    name: honk-core p1 (x86_64 + aarch64 + armv7)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.14.1

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep zstd

      - name: Build honk-core
        run: |
          mkdir -p patches/honk/honk
          bash patches/honk/ci/build-core.sh

      - name: Publish core assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: core-p1
          name: Patched honk core p1
          prerelease: true
          generate_release_notes: false
          files: |
            patches/honk/artifacts/cache/honk-core-*.tar.gz
            patches/honk/honk/generated-stage.mk
            patches/honk/honk/generated-provenance.json

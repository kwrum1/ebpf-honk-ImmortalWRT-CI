#
# OWRT-ALL: the only firmware pipeline in this repository.
#
# Targets: X86 and ROCKCHIP, both built from kwrum1/immortalwrt@mydist
# (eBPF datapath + honk handover). Everything else (MTK/QCA/IPQ) was removed
# with the upstream CI: this repo no longer tracks upstream's platform matrix
# and no longer chains off upstream's nightly Auto-Clean run.
#
# Triggers are self-contained on purpose:
#   * schedule  - one build a day, UTC 20:00 (04:00 CST)
#   * dispatch  - manual, with optional extra packages
# A new commit alone does NOT build: a build pins the source commit recorded in
# its provenance file, so an accidental push cannot silently change the image.

name: OWRT-ALL

on:
  schedule:
    - cron: 0 20 * * *
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: 'Extra package lines for .config (one per line)'
        required: false
        type: string
      TEST:
        description: 'Config-only run (no image)'
        default: 'false'
        required: false
        type: boolean

permissions: write-all

concurrency:
  group: owrt-all
  cancel-in-progress: false

jobs:
  config:
    name: ${{ matrix.CONFIG }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - CONFIG: ROCKCHIP
            SOURCE: kwrum1/immortalwrt
            BRANCH: mydist
          - CONFIG: X86
            SOURCE: kwrum1/immortalwrt
            BRANCH: mydist

    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: ${{ matrix.CONFIG }}
      WRT_THEME: aurora
      WRT_NAME: OWRT
      WRT_SSID: OWRT
      WRT_WORD: 12345678
      WRT_IP: 192.168.10.1
      WRT_PW: 无
      WRT_REPO: https://github.com/${{ matrix.SOURCE }}.git
      WRT_BRANCH: ${{ matrix.BRANCH }}
      WRT_SOURCE: ${{ matrix.SOURCE }}
      WRT_PACKAGE: ${{ inputs.PACKAGE }}
      WRT_TEST: ${{ inputs.TEST }}

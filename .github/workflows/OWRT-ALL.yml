#
# OWRT-ALL: the eBPF targets (X86, ROCKCHIP), built from
# kwrum1/immortalwrt@mydist (TC ingress fastpath + honk handover).
#
# The other platforms have their own pipelines and their own source branch:
#   MTK-ALL  -> MEDIATEK-WIFI-YES/NO      (kwrum1/immortalwrt@owrt, stock NSS)
#   QCA-ALL  -> IPQ60XX/IPQ807X (wifi)    (kwrum1/immortalwrt@owrt, stock NSS)
#   QCA-PPE  -> IPQ60XX/IPQ807X (no wifi) (kwrum1/immortalwrt@owrt)
#   WRT-TEST -> one configuration on demand
#
# Triggers are self-contained: a schedule per pipeline, a manual dispatch, and
# no dependency on upstream's workflow order (the old Auto-Clean chain).
# A push alone does NOT build; each release records the source commit.

name: OWRT-ALL

on:
  schedule:
    - cron: 0 19 * * *
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: 'Extra package lines for .config (one per line)'
        required: false
        type: string
      TEST:
        description: 'Config-only run (no image)'
        default: 'false'
        required: false
        type: boolean

permissions: write-all

concurrency:
  group: owrt-all
  cancel-in-progress: false

jobs:
  config:
    name: ${{ matrix.CONFIG }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - CONFIG: ROCKCHIP
            SOURCE: kwrum1/immortalwrt
            BRANCH: mydist
          - CONFIG: X86
            SOURCE: kwrum1/immortalwrt
            BRANCH: mydist

    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: ${{ matrix.CONFIG }}
      WRT_THEME: aurora
      WRT_NAME: OWRT
      WRT_SSID: OWRT
      WRT_WORD: 12345678
      WRT_IP: 192.168.10.1
      WRT_PW: 无
      WRT_REPO: https://github.com/${{ matrix.SOURCE }}.git
      WRT_BRANCH: ${{ matrix.BRANCH }}
      WRT_SOURCE: ${{ matrix.SOURCE }}
      WRT_PACKAGE: ${{ inputs.PACKAGE }}
      WRT_TEST: ${{ inputs.TEST }}

#
# QCB-ALL: the IPQ60xx / IPQ807x images built from the NSS-firmware branch.
#
# "QCB" = the Qualcomm NSS firmware variant, as opposed to QCA-ALL (the PPE
# variant built from owrt). Same configs, different source branch:
#
#   QCA-ALL  (PPE)    VIKINGYFY/immortalwrt@owrt   mainline PPE + flowtable
#   QCB-ALL  (NSSFW)  VIKINGYFY/immortalwrt@main   qca-nss-drv firmware offload
#
# The two are separate releases on purpose: the package sets and the offload
# engine differ, and mixing them makes "which image am I running" unanswerable.

name: QCB-ALL

on:
  schedule:
    - cron: 30 20 * * *
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: 'Extra package lines for .config'
        required: false
        type: string
      TEST:
        description: 'Config-only run (no image)'
        default: 'false'
        required: false
        type: boolean

permissions: write-all

jobs:
  config:
    name: ${{ matrix.CONFIG }}-NSSFW
    strategy:
      fail-fast: false
      matrix:
        CONFIG: [IPQ60XX-WIFI-YES, IPQ60XX-WIFI-NO, IPQ807X-WIFI-YES, IPQ807X-WIFI-NO]
        SOURCE: [VIKINGYFY/immortalwrt]
        BRANCH: [main]

    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: ${{ matrix.CONFIG }}
      WRT_THEME: aurora
      WRT_NAME: OWRT
      WRT_SSID: OWRT
      WRT_WORD: 12345678
      WRT_IP: 192.168.10.1
      WRT_PW: 无
      WRT_REPO: https://github.com/${{ matrix.SOURCE }}.git
      WRT_BRANCH: ${{ matrix.BRANCH }}
      WRT_SOURCE: ${{ matrix.SOURCE }}
      WRT_PACKAGE: ${{ inputs.PACKAGE }}
      WRT_TEST: ${{ inputs.TEST }}

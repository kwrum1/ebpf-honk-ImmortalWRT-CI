#
# EBPF-WRT-ALL: the eBPF targets (X86, ROCKCHIP).
#
# Firmware source: VIKINGYFY/immortalwrt@owrt (the upstream tree, unchanged).
# Datapath:        this repository's ebpf/ directory, copied into package/ by
#                  Scripts/Packages.sh. Only these two configs get it; every
#                  other target builds the stock package set.
#
# Trigger chain, same shape as upstream: Auto-Clean runs nightly and its
# completion starts every build pipeline (workflow_run above), plus manual
# dispatch. Every release records the firmware commit and the datapath hash in
# provenance-<CONFIG>.txt.

name: EBPF-WRT-ALL

on:
  # 自动编译：Auto-Clean 跑完后（与上游一致的“清理 -> 编译”链）
  workflow_run:
    workflows: ["Auto-Clean"]
    types:
      - completed
  # 手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: 'Extra package lines for .config'
        required: false
        type: string
      TEST:
        description: 'Config-only run (no image)'
        default: 'false'
        required: false
        type: boolean

permissions: write-all

concurrency:
  group: ebpf-wrt-all
  cancel-in-progress: false

jobs:
  config:
    name: ${{ matrix.CONFIG }}
    strategy:
      fail-fast: false
      matrix:
        CONFIG: [ROCKCHIP, X86]
        SOURCE: [VIKINGYFY/immortalwrt]
        BRANCH: [owrt]

    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: ${{ matrix.CONFIG }}
      WRT_THEME: aurora
      WRT_NAME: OWRT
      WRT_SSID: OWRT
      WRT_WORD: 12345678
      WRT_IP: 192.168.10.1
      WRT_PW: 无
      WRT_REPO: https://github.com/${{ matrix.SOURCE }}.git
      WRT_BRANCH: ${{ matrix.BRANCH }}
      WRT_SOURCE: ${{ matrix.SOURCE }}
      WRT_PACKAGE: ${{ inputs.PACKAGE }}
      WRT_TEST: ${{ inputs.TEST }}

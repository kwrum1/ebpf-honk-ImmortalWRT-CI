#云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        default: false
        type: boolean

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      cache_prefix: ${{steps.initialize-values.outputs.cache_prefix}}
      cache_key: ${{steps.clone-code.outputs.cache_key}}
    steps:
      - name: Checkout Projects
        uses: actions/checkout@v4

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -yqq purge firefox
          sudo apt-get -yqq update
          sudo apt-get -yqq full-upgrade
          sudo apt-get -yqq autoremove --purge
          sudo apt-get -yqq autoclean
          sudo apt-get -yqq clean

          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential bzip2 ca-certificates ccache clang \
            cmake cpio curl device-tree-compiler dos2unix file flex \
            g++-multilib gawk gcc-multilib genisoimage gettext git jq \
            libbpf-dev libclang-dev libdw-dev libelf-dev libncurses-dev libssl-dev lld \
            llvm ninja-build patch perl pkgconf python3 python3-cryptography \
            python3-dev python3-packaging python3-pyelftools python3-setuptools qemu-utils rsync swig \
            unzip wget xz-utils zlib1g-dev zstd

          sudo timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        id: initialize-values
        run: |
          WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[^=_]+(?=\=y)' "./Config/$WRT_CONFIG.txt")
          WRT_SUBTARGET=$(grep -m 1 -oP "^CONFIG_TARGET_${WRT_TARGET}_\K[^=_]+(?=\=y)" "./Config/$WRT_CONFIG.txt")
          WRT_CACHE_SOURCE=${WRT_SOURCE//\//-}
          WRT_CACHE_BRANCH=${WRT_BRANCH//\//-}
          WRT_CACHE_TARGET="$WRT_TARGET-$WRT_SUBTARGET"
          WRT_CACHE_PREFIX="wrt-$WRT_CACHE_SOURCE-$WRT_CACHE_BRANCH-$WRT_CACHE_TARGET"
          WRT_WIFI=$(grep -oE 'WIFI-(YES|NO)$' <<< "${WRT_CONFIG^^}" || true); WRT_WIFI=${WRT_WIFI:-none}

          {
            echo "WRT_INFO=${WRT_SOURCE%%/*}"
            echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}"
            echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")"
            echo "WRT_CACHE_PREFIX=$WRT_CACHE_PREFIX"
            echo "WRT_CACHE_TARGET=$WRT_CACHE_TARGET"
            echo "WRT_SUBTARGET=$WRT_SUBTARGET"
            echo "WRT_TARGET=$WRT_TARGET"
            echo "WRT_WIFI=$WRT_WIFI"
            echo "WRT_KVER=none"
            echo "WRT_LIST=none"
            echo "WRT_PROV=none"
            echo "WRT_PROV_LINE=数据面：未生成（config-only 运行）"
          } >> "$GITHUB_ENV"
          echo "cache_prefix=$WRT_CACHE_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Clone Code
        id: clone-code
        run: |
          # A single reset from github.com should not fail the whole build.
          for attempt in 1 2 3; do
            if git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/; then
              break
            fi
            echo "clone failed (attempt $attempt), retrying in 15s"
            rm -rf ./wrt
            sleep 15
            [ "$attempt" = 3 ] && exit 1
          done

          cd ./wrt/
          WRT_HASH=$(git rev-parse HEAD)
          {
            echo "WRT_HASH=$WRT_HASH"
            echo "WRT_HASH_FULL=$WRT_HASH"
            echo "WRT_HASH_DATE=$(git log -1 --pretty=format:'%cI')"
          } >> $GITHUB_ENV
          echo "WRT_CACHE_KEY=$WRT_CACHE_PREFIX-$WRT_HASH" >> $GITHUB_ENV
          echo "cache_key=$WRT_CACHE_PREFIX-$WRT_HASH" >> "$GITHUB_OUTPUT"

          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

          # The datapath that will actually be compiled: fail now, not 90 minutes
          # later, if the source tree lost it. Only the eBPF targets ship it; the
          # other configs build the stock package set.
          if [ "$WRT_CONFIG" = "X86" ] || [ "$WRT_CONFIG" = "ROCKCHIP" ]; then
            test -d "$GITHUB_WORKSPACE/ebpf/router-dataplane/src" || {
              echo "!! this repository has no ebpf/router-dataplane/src" >&2
              exit 1
            }
          fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      # Mechanical consistency gate (package install lists <-> menu.d <-> ACL <-
      # /etc/config <-> docs). Cheap, and it fails in seconds instead of after
      # the 90-minute compile.
      - name: Verify drift
        run: bash Scripts/verify-drift.sh

      - name: Restore Build Cache
        id: cache-restore
        if: ${{ !inputs.WRT_TEST }}
        uses: actions/cache/restore@v4
        with:
          key: ${{env.WRT_CACHE_KEY}}
          restore-keys: ${{env.WRT_CACHE_PREFIX}}-
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Prepare Restored Build Cache
        if: ${{ !inputs.WRT_TEST && steps.cache-restore.outputs.cache-matched-key != '' }}
        run: |
          find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
            find "$DIR" -type f -exec touch {} +
          done
          mkdir -p ./wrt/tmp
          echo "1" > ./wrt/tmp/.build
          echo "restored build cache: ${{steps.cache-restore.outputs.cache-matched-key}}"

      - name: Update Feeds
        run: |
          cd ./wrt/

          # Feeds fetch dozens of git remotes; retry the whole pass instead of
          # dying on one reset. `update` is incremental, so a retry is cheap.
          ./scripts/feeds update -a || { echo "feeds update failed, retrying"; sleep 15; ./scripts/feeds update -a; }
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh
          $GITHUB_WORKSPACE/.github/scripts/prepare-i2c-tools.sh

      # Small, stable inputs fetched from GitHub releases: the p1 honk core,
      # the doona tarball and the einat binary. They get their own cache so a
      # re-run does not depend on GitHub at all; the big build cache below holds
      # the toolchain, not these. The key is the set of asset names, so bumping
      # a pin (new commit, new asset name) misses the old cache instead of
      # restoring a stale binary.
      - name: Custom dl cache key
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/
          KEY=$(
            {
              sed -n 's/^HONK_ASSET_[A-Z0-9_]*:=//p' package/honk/generated-stage.mk 2>/dev/null
              sed -n 's/^PKG_SOURCE:=//p' package/luci-app-honk/Makefile 2>/dev/null
              sed -n 's/^[[:space:]]*EINAT_ASSET:=//p' package/ebpf/einat-ebpf/Makefile 2>/dev/null
            } | sha256sum | cut -d' ' -f1
          )
          echo "DPD_DL_KEY=$KEY" >> "$GITHUB_ENV"
          echo "custom dl key: $KEY"

      - name: Restore custom dl assets
        id: dl-restore
        if: ${{ !inputs.WRT_TEST }}
        uses: actions/cache/restore@v4
        with:
          key: dpd-dl-${{env.DPD_DL_KEY}}
          path: |
            ./wrt/dl/honk-core-*
            ./wrt/dl/doona-*
            ./wrt/dl/einat-*

      - name: Custom Settings
        run: |
          cd ./wrt/

          # .config is generated by Settings.sh only:
          #   X86 / ROCKCHIP -> Config/<CONFIG>.txt + Config/GENERAL.txt
          #   *TEST*         -> Config/<TEST>.txt alone
          $GITHUB_WORKSPACE/Scripts/Settings.sh
          $GITHUB_WORKSPACE/.github/scripts/prepare-build-host.sh

          make defconfig -j$(nproc) && make clean -j$(nproc)

          # What the fragment actually resolved to. Cheap, and the only way to
          # tell from the log which hostapd/wpad variant a target ended up with.
          echo "== resolved config =="
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE)=|^CONFIG_DRIVER_11(AX|BE)_SUPPORT|^CONFIG_PACKAGE_wpad[-a-z0-9]*=y|^CONFIG_PACKAGE_kmod-ath12k=y|^CONFIG_DEFAULT_wpad' .config || true

          # ViKingYFY's hostapd patch uses struct hostapd_config.he_mu_edca, a
          # member that only exists with CONFIG_IEEE80211AX. Without AX the patch
          # cannot compile and the image dies late inside hostapd; it is a no-op
          # anyway, so drop it for this build.
          if ! grep -q '^CONFIG_DRIVER_11AX_SUPPORT=y' .config; then
            echo "11AX support is off -> dropping hostapd MU-EDCA patch (needs CONFIG_IEEE80211AX)"
            rm -f package/network/services/hostapd/patches/900-hostapd-update-muedca-params.patch
          fi

          # qualcommbe: show why kmod-ath12k is (or is not) selectable, so a
          # missing dependency is visible here instead of at image assembly.
          if grep -q '^CONFIG_TARGET_BOARD="qualcommbe"' .config 2>/dev/null; then
            echo "== kmod-ath12k =="
            grep -B1 -A14 '^[[:space:]]*config PACKAGE_kmod-ath12k$' tmp/.config-package.in | head -20
            grep -E '^CONFIG_PACKAGE_kmod-(ath|mac80211)' .config || echo "  (no ath/mac80211 kmod selected)"
          fi

      - name: Prepare Rust Toolchain
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/.github/scripts/prepare-rust.sh

      - name: Download Packages
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          # One retry pass: a single unreachable mirror should not kill a build
          # that has already spent an hour on toolchain and packages. Files that
          # did arrive are kept, so the second run only fetches what is missing.
          make download -j$(nproc) || {
            echo "== download failed, retrying once =="
            sleep 15
            make download -j$(nproc)
          }

      - name: Save custom dl assets
        if: ${{ !inputs.WRT_TEST && success() && steps.dl-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          key: dpd-dl-${{env.DPD_DL_KEY}}
          path: |
            ./wrt/dl/honk-core-*
            ./wrt/dl/doona-*
            ./wrt/dl/einat-*

      - name: Compile Firmware
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          mkdir -p $GITHUB_WORKSPACE/build-reports
          make -j$(nproc) BUILD_TIME_LOG="$GITHUB_WORKSPACE/build-reports/parallel.tsv" || \
            make -j1 V=s BUILD_TIME_LOG="$GITHUB_WORKSPACE/build-reports/serial.tsv"

      - name: Collect Build Reports
        if: ${{ !inputs.WRT_TEST && always() }}
        continue-on-error: true
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/.github/scripts/collect-build-reports.sh

      - name: Upload Build Reports
        if: ${{ !inputs.WRT_TEST && always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{github.run_attempt}}
          path: ./build-reports/
          retention-days: 7

      - name: Save Build Cache
        if: ${{ !inputs.WRT_TEST && success() && steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          key: ${{env.WRT_CACHE_KEY}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Machine Information
        run: |
          cd ./wrt/

          # Hash the compiled datapath *now*: `make clean` below removes
          # build_dir, so the provenance step would otherwise record
          # sha256=none.
          OBJ=$(find ./build_dir -name 'dpd_fastpath.bpf.o' -type f 2>/dev/null | head -1)
          {
            echo "WRT_OBJ_SHA=$( [ -n "$OBJ" ] && sha256sum "$OBJ" | cut -d' ' -f1 || echo none )"
            echo "WRT_OBJ_SIZE=$( [ -n "$OBJ" ] && stat -c %s "$OBJ" || echo 0 )"
          } >> "$GITHUB_ENV"

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          if [[ "$WRT_TEST" != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} + || true

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              NEW_FILE="dpd-fw-wrt-$NAME-${WRT_WIFI#WIFI-}-$WRT_DATE.$EXT"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \; || true

            make clean -j$(nproc)
          fi

      - name: Build Provenance
        run: |
          cd ./wrt/

          ABI=$(grep -oP '^#define DPD_ABI_VERSION\s+\K[0-9]+' "$GITHUB_WORKSPACE/ebpf/router-dataplane/src/dpd_common.h" 2>/dev/null || echo "unknown")
          # Hashed before `make clean` (Machine Information).
          OBJ_SHA="${WRT_OBJ_SHA:-none}"
          OBJ_SIZE="${WRT_OBJ_SIZE:-0}"
          SRC_SHA=$(cd "$GITHUB_WORKSPACE/ebpf" && find . -type f -name '*.c' -o -type f -name '*.h' | sort | xargs sha256sum 2>/dev/null | sha256sum | cut -d' ' -f1)
          CLANG_VER=$(clang --version | head -1)
          LIBBPF_VER=$(pkg-config --modversion libbpf 2>/dev/null || echo "unknown")
          EINAT_BIN=$(sed -n 's|^[[:space:]]*EINAT_ASSET:=\(einat-[^[:space:]]*\)|\1|p' "$GITHUB_WORKSPACE/ebpf/einat-ebpf/Makefile" 2>/dev/null | head -1)

          {
            echo "config        $WRT_CONFIG"
            echo "source        $WRT_SOURCE"
            echo "branch        $WRT_BRANCH"
            echo "commit        $WRT_HASH"
            echo "commit_full   $WRT_HASH_FULL"
            echo "commit_date   $WRT_HASH_DATE"
            echo "target        $WRT_TARGET"
            echo "kernel        $WRT_KVER"
            echo "ebpf_abi      $ABI"
            echo "ebpf_object   sha256=$OBJ_SHA size=$OBJ_SIZE"
            echo "ebpf_src_tree sha256=$SRC_SHA"
            echo "einat_bin     ${EINAT_BIN:-none}"
            echo "clang         $CLANG_VER"
            echo "libbpf        $LIBBPF_VER"
            echo "built_at      $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee ./upload/provenance-"$WRT_CONFIG".txt

          echo "WRT_PROV=abi=$ABI object=${OBJ_SHA:0:16} src=$WRT_HASH" >> $GITHUB_ENV
          # Decide from the *target*, not from whether an object was found:
          # X86/ROCKCHIP always ship the eBPF layer.
          case "$WRT_CONFIG" in
          X86 | ROCKCHIP)
            echo "WRT_PROV_LINE=eBPF 数据面：abi=$ABI object=${OBJ_SHA:0:16} src=$WRT_HASH" >> $GITHUB_ENV
            ;;
          *)
            echo "WRT_PROV_LINE=数据面：平台原厂（PPE/NSS），本镜像不含 ebpf/ 数据面" >> $GITHUB_ENV
            ;;
          esac

      - name: Upload Provenance
        if: ${{ !inputs.WRT_TEST }}
        uses: actions/upload-artifact@v4
        with:
          name: provenance-${{env.WRT_CONFIG}}
          path: ./wrt/upload/provenance-*.txt

      - name: Release Firmware
        if: ${{ !inputs.WRT_TEST }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dpd-fw-wrt-${{env.WRT_CONFIG}}-${{env.WRT_DATE}}
          name: DPD-FW-WRT ${{env.WRT_CONFIG}} ${{env.WRT_DATE}}
          files: ./wrt/upload/*
          body: |
            **DPD-FW-WRT** 固件包，内含多个设备，请选择需要的设备固件。

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}

            ${{env.WRT_PROV_LINE}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            WIFI名称：${{env.WRT_SSID}}
            WIFI密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}

            每个 release 都带 provenance-<CONFIG>.txt：固件源提交、配置、内核、
            clang/libbpf 版本；X86/ROCKCHIP 另含 eBPF ABI、BPF 对象哈希与体积、
            ebpf/ 源码树哈希。

  cache-rollover:
    name: Roll cache generations
    needs: core
    if: ${{ !inputs.WRT_TEST && needs.core.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: wrt-cache-rollover-${{github.ref}}-${{needs.core.outputs.cache_prefix}}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      GH_REPO: ${{github.repository}}
      WRT_CACHE_PREFIX: ${{needs.core.outputs.cache_prefix}}
      WRT_CACHE_KEY: ${{needs.core.outputs.cache_key}}
    steps:
      - name: Roll Build Cache
        run: |
          set -euo pipefail

          CURRENT_CACHE_KEYS=$(gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_KEY" --ref "$GITHUB_REF" --limit 100 --json key --jq '.[].key')
          CURRENT_CACHE_FOUND=0
          while IFS= read -r CACHE_KEY; do
            if [ "$CACHE_KEY" = "$WRT_CACHE_KEY" ]; then
              CURRENT_CACHE_FOUND=1
              break
            fi
          done <<< "$CURRENT_CACHE_KEYS"

          if [ "$CURRENT_CACHE_FOUND" -ne 1 ]; then
            echo "skip cache rollover: current cache is not available yet"
            exit 0
          fi

          gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_PREFIX-" --ref "$GITHUB_REF" --limit 100 --json id,key --jq '.[] | [.id, .key] | @tsv' |
            while IFS=$'\t' read -r CACHE_ID CACHE_KEY; do
              [ -n "$CACHE_ID" ] || continue
              [ "$CACHE_KEY" = "$WRT_CACHE_KEY" ] && continue
              gh cache delete "$CACHE_ID" --repo "$GH_REPO" ||
                echo "warning: failed to delete cache $CACHE_ID ($CACHE_KEY)"
            done

#
# QCA-NSS: the NSS-firmware build of every supported Qualcomm target.
#
# Source: VIKINGYFY/immortalwrt@main (NSS firmware branch).
#
# This is the NSS-firmware flavour of the same four IPQ60xx/IPQ807x configs
# that QCA-PPE builds from @owrt; here they come from @main with the NSS
# firmware stack.
#
#   IPQ60XX / IPQ807x   both flavours: owrt (PPE, QCA-PPE) and main (NSS, here)
#   IPQ95xx             not built: upstream qualcommbe fails on kmod-ath12k
#                       (same reason as QCA-PPE); Config/IPQ95XX.txt stays.
#
# Configs are upstream's own Config/*.txt files.

name: QCA-NSS

on:
  # 自动编译：Auto-Clean 跑完后（与上游一致的“清理 -> 编译”链）
  workflow_run:
    workflows: ["Auto-Clean"]
    types:
      - completed
  # 手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: 'Extra package lines for .config'
        required: false
        type: string
      TEST:
        description: 'Config-only run (no image)'
        default: false
        required: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: qca-nss
  cancel-in-progress: false

jobs:
  config:
    name: ${{ matrix.CONFIG }}
    strategy:
      fail-fast: false
      matrix:
        CONFIG: [IPQ60XX-WIFI-YES, IPQ60XX-WIFI-NO, IPQ807X-WIFI-YES, IPQ807X-WIFI-NO]
        SOURCE: [VIKINGYFY/immortalwrt]
        BRANCH: [main]

    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: ${{ matrix.CONFIG }}
      WRT_THEME: vantage
      WRT_NAME: OWRT
      WRT_SSID: OWRT
      WRT_WORD: 12345678
      WRT_IP: 192.168.10.1
      WRT_PW: 无
      WRT_REPO: https://github.com/${{ matrix.SOURCE }}.git
      WRT_BRANCH: ${{ matrix.BRANCH }}
      WRT_SOURCE: ${{ matrix.SOURCE }}
      WRT_PACKAGE: ${{ inputs.PACKAGE }}
      WRT_TEST: ${{ inputs.TEST || false }}

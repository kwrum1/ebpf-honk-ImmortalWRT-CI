#
# QCA-NSS: the Qualcomm NSS-firmware platforms (IPQ53xx / IPQ95xx).
#
# Source: VIKINGYFY/immortalwrt@main. That is the branch where target/linux/
# qualcommbe is complete (image/, ipq95xx/, ...) and where the NSS firmware
# driver stack lives; on `owrt` the same directory only carries Makefile/config/
# dts. Configs are upstream's own Config/IPQ53XX.txt and Config/IPQ95XX.txt.
#
# The PPE counterpart for IPQ60xx / IPQ807x is QCA-PPE (branch owrt).

name: QCA-NSS

on:
  schedule:
    - cron: 30 20 * * *
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: 'Extra package lines for .config'
        required: false
        type: string
      TEST:
        description: 'Config-only run (no image)'
        default: 'false'
        required: false
        type: boolean

permissions: write-all

jobs:
  config:
    name: ${{ matrix.CONFIG }}
    strategy:
      fail-fast: false
      matrix:
        CONFIG: [IPQ53XX, IPQ95XX]
        SOURCE: [VIKINGYFY/immortalwrt]
        BRANCH: [main]

    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: ${{ matrix.CONFIG }}
      WRT_THEME: aurora
      WRT_NAME: OWRT
      WRT_SSID: OWRT
      WRT_WORD: 12345678
      WRT_IP: 192.168.10.1
      WRT_PW: 无
      WRT_REPO: https://github.com/${{ matrix.SOURCE }}.git
      WRT_BRANCH: ${{ matrix.BRANCH }}
      WRT_SOURCE: ${{ matrix.SOURCE }}
      WRT_PACKAGE: ${{ inputs.PACKAGE }}
      WRT_TEST: ${{ inputs.TEST }}

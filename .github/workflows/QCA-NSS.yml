#
# QCA-NSS: the NSS-firmware build of every supported Qualcomm target.
#
# Source: VIKINGYFY/immortalwrt@main (NSS firmware branch).
#
# This is the *same device list as QCA-PPE* plus the two platforms that only
# exist here:
#
#   IPQ60XX / IPQ807x   both flavours: owrt (PPE, QCA-PPE) and main (NSS, here)
#   IPQ53XX / IPQ95XX   NSS only: target/linux/qualcommbe has no image/ on
#                       owrt (just Makefile/config-6.18/dts), so a PPE build
#                       of these boards cannot be produced from that branch.
#
# Configs are upstream's own Config/*.txt files.

name: QCA-NSS

on:
  schedule:
    - cron: 30 20 * * *
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: 'Extra package lines for .config'
        required: false
        type: string
      TEST:
        description: 'Config-only run (no image)'
        default: 'false'
        required: false
        type: boolean

permissions: write-all

jobs:
  config:
    name: ${{ matrix.CONFIG }}
    strategy:
      fail-fast: false
      matrix:
        CONFIG: [IPQ60XX-WIFI-YES, IPQ60XX-WIFI-NO, IPQ807X-WIFI-YES, IPQ807X-WIFI-NO, IPQ53XX, IPQ95XX]
        SOURCE: [VIKINGYFY/immortalwrt]
        BRANCH: [main]

    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: ${{ matrix.CONFIG }}
      WRT_THEME: aurora
      WRT_NAME: OWRT
      WRT_SSID: OWRT
      WRT_WORD: 12345678
      WRT_IP: 192.168.10.1
      WRT_PW: 无
      WRT_REPO: https://github.com/${{ matrix.SOURCE }}.git
      WRT_BRANCH: ${{ matrix.BRANCH }}
      WRT_SOURCE: ${{ matrix.SOURCE }}
      WRT_PACKAGE: ${{ inputs.PACKAGE }}
      WRT_TEST: ${{ inputs.TEST }}

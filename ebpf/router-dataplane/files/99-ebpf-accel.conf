# dpd-fastpath accelerates established flows past netfilter. The client's
# ACKs never reach conntrack, so conntrack's TCP window stays at the
# handshake values; the server's replies then arrive outside that window.
# With the default window validation fw4 marks them INVALID and REJECTs them
# with a RST, which kills every accelerated uplink flow after the first
# window (measured: TLS fails right after the client Finished, HTTP stops at
# ~42 KB). Being liberal about the window check still requires a matching
# conntrack entry, so unsolicited traffic is not accepted.
#
# The same setting is re-applied from /etc/init.d/dpd-fastpath so an in-place
# upgrade or a service restart does not need a reboot.
net.netfilter.nf_conntrack_tcp_be_liberal=1

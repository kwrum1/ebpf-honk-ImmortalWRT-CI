# SmartDNS: China/foreign split over DoH, dual-stack IP preference.
#
# Included last by the generated smartdns.conf. All upstreams use an IP URL
# plus -host-name (SNI + certificate check): no bootstrap lookup is needed, and
# older smartdns builds do not know the bootstrap-dns keyword.
#
# Groups:
#   proxy (default) - foreign DoH; everything not matched below goes here
#   cn              - domestic DoH; matched by /cn/ and the CN domain set

# --- foreign group (also the default group) ---------------------------------
server https://1.1.1.1/dns-query -host-name cloudflare-dns.com -group proxy
server https://8.8.8.8/dns-query -host-name dns.google -group proxy

# --- domestic group ---------------------------------------------------------
server https://223.5.5.5/dns-query -host-name dns.alidns.com -group cn -exclude-default-group
server https://1.12.12.12/dns-query -host-name doh.pub -group cn -exclude-default-group
server https://120.53.53.53/dns-query -host-name doh.pub -group cn -exclude-default-group

# --- split: CN domains -> domestic, everything else -> foreign -------------
domain-set -name cn -type list -file /etc/smartdns/domain-set/cn.list
nameserver /domain-set:cn/cn
nameserver /cn/cn

# --- dual-stack: pick the family that answers faster ------------------------
dualstack-ip-selection yes
dualstack-ip-selection-threshold 10
dualstack-ip-allow-force-AAAA yes
response-mode fastest-ip
speed-check-mode ping,tcp:80,tcp:443

# --- cache / prefetch -------------------------------------------------------
cache-size 32768
prefetch-domain yes
serve-expired yes
serve-expired-ttl 86400
serve-expired-reply-ttl 3
rr-ttl-min 60
rr-ttl-max 600

# SmartDNS: CN/foreign split over DoH, dual-stack IP preference.
#
# Design (with honk):
#   * clients use this resolver on 127.0.0.1:53;
#   * CN domains -> domestic DoH (AliDNS/DNSPod), sent direct;
#   * everything else -> foreign DoH (Cloudflare/Google). Those IPs are
#     unreachable from a Chinese line directly, so honk's routing sends
#     them through the proxy (config.dae: "dip(1.1.1.1, 8.8.8.8, ...) ->
#     proxy"); the router's own traffic is intercepted by honk's cgroup
#     hooks, so smartdns does not need to know about the proxy.
#
# Every upstream is an IP URL plus -host-name (SNI + certificate check), so
# no bootstrap lookup is needed and no bootstrap-dns keyword is used.
#
# Groups:
#   cn              - AliDNS + DNSPod; matched by /cn/ and the CN domain set
#   (default)       - Cloudflare + Google; everything else, via honk proxy

# --- foreign group (also the default group) ---------------------------------
server https://1.1.1.1/dns-query -host-name cloudflare-dns.com
server https://8.8.8.8/dns-query -host-name dns.google

# --- domestic group ---------------------------------------------------------
server https://223.5.5.5/dns-query -host-name dns.alidns.com -group cn -exclude-default-group
server https://1.12.12.12/dns-query -host-name doh.pub -group cn -exclude-default-group
server https://120.53.53.53/dns-query -host-name doh.pub -group cn -exclude-default-group

# --- split: CN domains -> domestic group, everything else -> default --------
domain-set -name cn -type list -file /etc/smartdns/domain-set/cn.list
nameserver /domain-set:cn/cn
nameserver /cn/cn

# --- dual-stack: pick the family that answers faster ------------------------
dualstack-ip-selection yes
dualstack-ip-selection-threshold 10
dualstack-ip-allow-force-AAAA yes
response-mode fastest-ip
speed-check-mode ping,tcp:80,tcp:443

# --- cache / prefetch -------------------------------------------------------
cache-size 32768
prefetch-domain yes
serve-expired yes
serve-expired-ttl 86400
serve-expired-reply-ttl 3
rr-ttl-min 60
rr-ttl-max 600

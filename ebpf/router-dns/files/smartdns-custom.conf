# SmartDNS: CN/foreign split over DoH, dual-stack IP preference.
#
# Every upstream is reachable from a Chinese broadband line. All DoH URLs use
# an IP plus -host-name (SNI + certificate check), so no bootstrap lookup and
# no bootstrap-dns keyword (this smartdns build does not know it).
#
# Why the "foreign" group is not Cloudflare/Google: from this line those
# resolvers are unreachable, so the default group would answer nothing:
#   - ICMP to 1.1.1.1 / 8.8.8.8 / 9.9.9.9 is fine (250 ms), but TCP/443 to
#     1.1.1.1, 8.8.8.8, 9.9.9.9, 208.67.222.222, 94.140.14.14 never completes;
#   - TCP/443 to 45.90.28.0 (NextDNS), 76.76.2.0 (ControlD), 194.242.2.2
#     (Mullvad) does complete, but a TLS handshake for dns.nextdns.io,
#     doh.controld.com, dns.mullvad.net, dns.sb or doh.libredns.gr is dropped
#     (SNI filtering).
# So the default group stays on a domestic DoH that gives correct global
# answers for everything that is not blocked anyway; blocked sites need a
# proxy, not a different resolver. If a self-hosted DoH exists on a VPS, add
# it here and drop -exclude-default-group from it.
#
# Groups:
#   cn              - AliDNS + DNSPod; matched by /cn/ and the CN domain set
#   (default)       - DNSPod; everything not matched above

# --- domestic group ---------------------------------------------------------
server https://223.5.5.5/dns-query -host-name dns.alidns.com -group cn -exclude-default-group
server https://1.12.12.12/dns-query -host-name doh.pub -group cn
server https://120.53.53.53/dns-query -host-name doh.pub

# --- split: CN domains -> domestic group, everything else -> default --------
domain-set -name cn -type list -file /etc/smartdns/domain-set/cn.list
nameserver /domain-set:cn/cn
nameserver /cn/cn

# --- dual-stack: pick the family that answers faster ------------------------
dualstack-ip-selection yes
dualstack-ip-selection-threshold 10
dualstack-ip-allow-force-AAAA yes
response-mode fastest-ip
speed-check-mode ping,tcp:80,tcp:443

# --- cache / prefetch -------------------------------------------------------
cache-size 32768
prefetch-domain yes
serve-expired yes
serve-expired-ttl 86400
serve-expired-reply-ttl 3
rr-ttl-min 60
rr-ttl-max 600

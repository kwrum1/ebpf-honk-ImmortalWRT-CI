# DPD class policy (applied by dpdfwd through dpdctl).
#
# One rule per line:
#   <iface|any> <proto|tcp|udp|number> <saddr> <sport> <daddr> <dport> \
#       <forward|proxy|block|local> [skb_priority]
#
# - iface `any` or `0` and port `0` are wildcards; addresses are exact
#   (no CIDR).
# - Rules are copied into the UFS entry when a flow is learned. To apply a
#   change to already-learned flows, run `dpdctl bump` (or delete them).
# - In `nat_forward=einat` mode a new flow is only learned after einat has a
#   binding, so very short flows may finish before the rule applies; DPD-owned
#   NAT (`nat_forward=dpd`) applies it on the first packet.
#
# Examples:
#   any tcp 192.168.10.50 0 198.18.0.2 8000 block
#   br-lan udp 192.168.10.50 0 192.168.10.1 53 proxy 10
#   any tcp 192.168.10.0 0 0.0.0.0 0 forward

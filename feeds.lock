# feeds.lock —— 已验证可用的「基线组合」记录
#
# 为什么是这个形式，而不是 feeds.conf 里的 SHA 钉住：
#   * feeds.conf 用的是分支名（scripts/feeds update 会跟随远端最新），
#     把分支换成 SHA 会让 feed 永远停留在某次提交上，且一旦上游 gc 掉该对象
#     整个构建就直接失败 —— 对家用固件来说风险大于收益。
#   * Scripts/Packages.sh 用 `git clone --depth=1`，且在 pkg 模式下会 rm -rf 掉
#     .git，所以第三方插件本身**没有**可钉住的 commit 记录。
# 因此这里记录「一次通过验证的组合」，作为回归时的对照基准。
# 校验方法：Scripts/verify-packages.sh
#
# 本记录对应：
#   固件 hash = 5fda931（ROCKCHIP + X86 均由此 hash 构建成功，静态校验全通过）
#   x86 动态校验（QEMU+OVMF）通过：honk-core 正常运行、26 个 pinned BPF map、
#   TC redirect 数据面生效。
# =============================================================================

[meta]
baseline_hash   = 5fda931
kernel          = 6.18.55
recorded_at     = 2026-10-17
recorded_by     = local reproduction (/opt/wrt)

# upstream source
[source]
repo            = https://github.com/VIKINGYFY/immortalwrt.git
branch          = owrt

# feeds.conf 观察到的 commit（scripts/feeds update 之后）
[feeds]
